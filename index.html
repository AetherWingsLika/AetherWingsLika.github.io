<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Wings Lika – Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="/" class="home-btn">Home</a>
  </header>

  <main>
    <section class="hero">
      <h1>Not a rating website<span class="emoji">⭐</span></h1>
      <p class="subtitle">
        Liste des matchs vu en 2026-2027. Jupiler Pro League, Challenger Pro League et Serie A. 
      </p>

     <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="jupiler">Jupiler Pro League</button>
      <button class="filter-btn" data-filter="serie-a">Serie A</button>
      <button class="filter-btn" data-filter="autres">Autres</button>
     </div>
    </section>

    <section class="cards" id="cards-container">
      <!-- Cards are injected here by JS -->
    </section>

    <div id="loading" class="loading hidden">Loading more…</div>
  </main>

  <script src="script.js"></script>
  <footer class="site-footer">
  <a href="https://twitter.com/AetherWingsLika" target="_blank" rel="noopener">
    Blog by @AetherWingsLika
  </a>
</footer>
</body>
</html>
