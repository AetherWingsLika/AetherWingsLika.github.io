<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherWingsLika's Blog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/images/site.webmanifest">
</head>
<body>
<main>
    <section class="hero">
      <h1>AWLika's match history</h1>
      <p class="subtitle">
        Liste des matchs vus en 2026-2027. Jupiler Pro League, Challenger Pro League, Serie A et quelques matchs autour du monde. 
      </p>

     <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="jupiler">JPL</button>
      <button class="filter-btn" data-filter="serie-a">Serie A</button>
      <button class="filter-btn" data-filter="autres">Autres</button>
      <button class="filter-btn" data-filter="favorites">Favoris</button>
      <button class="filter-btn" data-filter="stats">Stats RSCL</button>
     </div>
    </section>

    <section class="cards" id="cards-container">
      <!-- Cards are injected here by JS -->
    </section>

    <div id="loading" class="loading hidden">Loading more…</div>
  </main>

  <script src="script.js"></script>
  <footer class="site-footer">
  <a href="https://twitter.com/AetherWingsLika" target="_blank" rel="noopener">
    Blog by @AetherWingsLika
  </a>
</footer>
</body>
</html>
