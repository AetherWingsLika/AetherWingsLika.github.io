<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minutes & Stats – Standard & SL16</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .stats-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 3rem;
    }

    .stats-page h1 {
      font-size: 1.9rem;
      margin-bottom: 0.4rem;
    }

    .stats-page .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
    }

    .update {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    .stats-section {
      margin-bottom: 3.5rem;
    }

    .stats-section h2 {
      font-size: 1.35rem;
      margin-bottom: 1rem;
      color: #e5e5e5;
    }

    .stats-section img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      background: #111;
    }
  </style>
  <script>
  document.querySelectorAll(".zoomable").forEach(img => {
    img.addEventListener("click", () => {
      img.classList.toggle("zoomed");
    });
  });
</script>
</head>
<body>
  <header>
    <a href="../" class="home-btn">Home</a>
  </header>

  <main class="stats-page">
    <h1>Minutes • Buts • Passes</h1>
    <p class="subtitle">Suivi détaillé des joueurs – Saison 2026-2027</p>
    <p class="update">Dernière mise à jour : 11 août 2026</p>

    <!-- Standard Liège -->
    <section class="stats-section">
      <h2>Standard Liège</h2>
      <img src="../images/statsrscl.png" alt="Standard Liège - Minutes Buts Passes" class="zoomable">
    </section>

    <!-- SL16 -->
    <section class="stats-section">
      <h2>SL16 FC</h2>
      <img src="../images/statssl16.png" alt="SL16 FC - Minutes Buts Passes" class="zoomable">
    </section>
  </main>

  <footer class="site-footer">
    <a href="https://twitter.com/AetherWingsLika" target="_blank" rel="noopener">
      Blog by @AetherWingsLika
    </a>
  </footer>
</body>
</html>
